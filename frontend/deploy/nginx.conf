resolver 127.0.0.11 valid=5s ipv6=off;
upstream auth_backend { zone auth_backend 64k; server auth:8080 resolve; }
upstream rag_backend { zone rag_backend 64k; server rag:8001 resolve; }
upstream voice_backend { zone voice_backend 64k; server voice:8008 resolve; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/ { proxy_pass http://auth_backend; }
    location = /rag-query { proxy_pass http://rag_backend; }
    location = /health { proxy_pass http://rag_backend; }
    location /voice/ { proxy_pass http://voice_backend; }
    location /guides/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
