# 약속 확인 테스트 자동 실행 — PR 을 올리거나 main·dev 에 push 하면 돈다.
# 검색·LLM 은 가짜로 바꿔서 돌리므로 OpenAI 키(Secrets)가 필요 없다.
name: contract-test

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: 패키지 설치 (RAG 만, torch 는 CPU 전용판으로 — GPU 판은 수 GB 라 느림)
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt "python-jose[cryptography]==3.3.0" "pytest>=8,<9"

      - name: 약속 확인 테스트
        run: python -m pytest -q tests

      - name: 음성 API 테스트 (Whisper·OpenAI 는 가짜로 바꿔서 돈다)
        working-directory: voice-service
        run: python -m pytest -q tests   # 패키지는 위 RAG 설치(fastapi·python-multipart·jose)로 충분

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 패키지 설치 (화면 템플릿 시험에 vue 필요)
        working-directory: frontend
        run: npm ci

      - name: 프론트 테스트 (API 계약·음성 모드·다국어 문구)
        working-directory: frontend
        run: node --test tests/*.test.js
