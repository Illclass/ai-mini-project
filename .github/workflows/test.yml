# 약속 확인 테스트 자동 실행 — PR 을 올리거나 main·dev 에 push 하면 돈다.
# 검색·LLM 은 가짜로 바꿔서 돌리므로 OpenAI 키(Secrets)가 필요 없다.
name: contract-test

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: 패키지 설치 (RAG 만 — 음성용 torch 는 빼서 빠르게)
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt "python-jose[cryptography]==3.3.0" "pytest>=8,<9"

      - name: 약속 확인 테스트
        run: python -m pytest -q tests
